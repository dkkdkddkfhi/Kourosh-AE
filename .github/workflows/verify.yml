name: Kourosh-AE Verify Build
# Compiles the app on every pull request without signing and without
# publishing anything. Releases stay in build.yml (manual dispatch only).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Compile unsigned arm64 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kourosh-AE
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;26.3.11579264 cmake;3.22.1'
          accept-android-sdk-licenses: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK and unsigned release (runs lintVital)
        run: ./gradlew assembleDebug assembleRelease -PtargetAbi=arm64-v8a --no-daemon
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-AE-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
