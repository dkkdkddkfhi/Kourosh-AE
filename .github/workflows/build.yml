name: Kourosh-AE Android Release
on:
  workflow_dispatch:
  # Working branches publish on push. The automation token used to drive this repo
  # has Contents: write but not Actions: write, so it cannot call the dispatch API
  # (HTTP 403) — a push event is the one trigger it can always reach. Scoped to
  # `arena/**` so the release branch and main are unaffected.
  push:
    branches:
      - 'arena/**'
permissions:
  contents: write
jobs:
  build:
    name: Build Kourosh-AE signed APK and Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kourosh-AE
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;26.3.11579264 cmake;3.22.1'
          accept-android-sdk-licenses: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Test Aether core before Android packaging
        run: cargo test --manifest-path core/aether/Cargo.toml --lib
      - name: Prepare signing keystore
        env:
          KOUROSH_AE_KEYSTORE_B64: ${{ secrets.KOUROSH_AE_KEYSTORE_B64 }}
        run: |
          test -n "$KOUROSH_AE_KEYSTORE_B64" || { echo 'Missing KOUROSH_AE_KEYSTORE_B64'; exit 1; }
          echo "$KOUROSH_AE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build signed APKs and Play AAB
        env:
          KOUROSH_AE_KEYSTORE_PASSWORD: ${{ secrets.KOUROSH_AE_KEYSTORE_PASSWORD }}
          KOUROSH_AE_KEY_ALIAS: ${{ secrets.KOUROSH_AE_KEY_ALIAS }}
          KOUROSH_AE_KEY_PASSWORD: ${{ secrets.KOUROSH_AE_KEY_PASSWORD }}
        run: |
          test -n "$KOUROSH_AE_KEYSTORE_PASSWORD" || { echo 'Missing KOUROSH_AE_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KOUROSH_AE_KEY_ALIAS" || { echo 'Missing KOUROSH_AE_KEY_ALIAS'; exit 1; }
          test -n "$KOUROSH_AE_KEY_PASSWORD" || { echo 'Missing KOUROSH_AE_KEY_PASSWORD'; exit 1; }
          set -o pipefail
          ./gradlew assembleRelease bundleRelease -PkouroshAeKeystore=release.keystore --no-daemon 2>&1 | tee /tmp/gradle.log
      # The build log lives on a host this project's automation cannot reach, so on
      # failure the compiler output is committed back to the branch that ran it.
      # That file is the only place a failing build can be read from.
      - name: Commit compiler diagnostics on failure
        if: failure()
        run: |
          mkdir -p .ci
          {
            echo "# Gradle failure on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '## Errors'
            echo '```'
            grep -nE '^(e|w): |error:|ERROR:|FAILURE:|Execution failed|> Task .*FAILED|Caused by:|What went wrong' /tmp/gradle.log | head -300 || true
            echo '```'
            echo
            echo '## Tail'
            echo '```'
            tail -120 /tmp/gradle.log || true
            echo '```'
          } > .ci/last-failure.md
          git config user.name 'kourosh-ae-ci'
          git config user.email 'ci@users.noreply.github.com'
          git add -f .ci/last-failure.md
          git commit -m 'ci: record compiler diagnostics [skip ci]' || true
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true
      - name: Verify signed APKs
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified release APK: $apk"
          done
      - name: Upload signed APK and Play AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-AE-v2.1.22-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      # A checksum file next to the APKs: the install warning tells people to check
      # what they downloaded, and until now there was nothing to check it against.
      - name: Write SHA-256 checksums for the APKs
        run: |
          cd app/build/outputs/apk/release
          sha256sum ./*.apk > SHA256SUMS
          cat SHA256SUMS
      # The notes live in a quoted heredoc rather than in a quoted flag. The prose
      # says "the tunnel's state"; inside a single-quoted argument that apostrophe
      # closes the string, the shell hits the next parenthesis and dies with a syntax
      # error before gh is ever called. That is what cost v2.1.22 its release. A
      # quoted heredoc takes apostrophes, real newlines and em dashes as written, so
      # there is nothing left to escape.
      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          The crown release: a new header, a real crown on the notification, fewer controls in the way, and a steadier tunnel.

          **New.** The home header is now the crest crown drawn as a vector, the wordmark, and
          a state chip that names the tunnel's state beside its LED. The menu and settings
          buttons are gone from the header. Settings lives in the dock with the other
          destinations, where it always did have a home.

          **The crown.** The notification and the Quick Settings tile now carry a proper royal
          crown: five points, a bezel band and pearls, one white silhouette that stays crisp at
          status-bar size. It replaces the crown-on-shield-on-core mark that read as a smudge at
          24 dp. The expanded notification badge is the same crown in gold on the app plate.

          **Harder to filter.** MASQUE leads the transport rail and is the default for a fresh
          install: HTTP/3 over UDP/443, falling back to HTTP/2 over TCP/443 with handshake
          fragmentation, both ports a filtered network has to leave open. TLS ClientHello
          fragmentation and a mixed-case SNI are on by default as well. WireGuard, WARP-on-WARP,
          Psiphon, Tor and SHARD follow, and Auto Scan walks the same order. A transport you
          already picked is kept.

          **Stability.** A connected tunnel is no longer torn down and reconnected after about a
          minute of quiet downstream traffic. The liveness watchdog now waits five minutes before
          it suspects a healthy session, so a phone sitting on a chat screen stops looking like a
          dropped tunnel. The tunnel also survives a swipe out of the recents list
          (stopWithTask=false), so that swipe is no longer a way to lose a working session.

          **Simpler.** The profile picker and the font-family picker are gone. The app ships one
          voice on the system face, and Appearance keeps a text-size control, which is the part
          that helps readability.

          **About the install warning.** This APK is signed with this project's own release key.
          Play Protect warns about any sideloaded app whose developer Google has not verified;
          that warning is about who distributes the file, not about the file. It is unchanged
          from previous releases, and nothing inside an APK can switch it off. To check the
          download, compare it against the SHA-256 in SHA256SUMS, released alongside the APKs.

          NOTES
          gh release view v2.1.22 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create v2.1.22 --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title 'Kourosh-AE v2.1.22' \
              --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish signed APK and AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.1.22 app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/SHA256SUMS \
            --repo "${{ github.repository }}" --clobber
