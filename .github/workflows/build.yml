name: Kourosh-AE Android Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Kourosh-AE signed APK and Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kourosh-AE
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;26.3.11579264 cmake;3.22.1'
          accept-android-sdk-licenses: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Test Aether core before Android packaging
        run: cargo test --manifest-path core/aether/Cargo.toml --lib
      - name: Prepare signing keystore
        env:
          KOUROSH_AE_KEYSTORE_B64: ${{ secrets.KOUROSH_AE_KEYSTORE_B64 }}
        run: |
          test -n "$KOUROSH_AE_KEYSTORE_B64" || { echo 'Missing KOUROSH_AE_KEYSTORE_B64'; exit 1; }
          echo "$KOUROSH_AE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build signed APKs and Play AAB
        env:
          KOUROSH_AE_KEYSTORE_PASSWORD: ${{ secrets.KOUROSH_AE_KEYSTORE_PASSWORD }}
          KOUROSH_AE_KEY_ALIAS: ${{ secrets.KOUROSH_AE_KEY_ALIAS }}
          KOUROSH_AE_KEY_PASSWORD: ${{ secrets.KOUROSH_AE_KEY_PASSWORD }}
        run: |
          test -n "$KOUROSH_AE_KEYSTORE_PASSWORD" || { echo 'Missing KOUROSH_AE_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KOUROSH_AE_KEY_ALIAS" || { echo 'Missing KOUROSH_AE_KEY_ALIAS'; exit 1; }
          test -n "$KOUROSH_AE_KEY_PASSWORD" || { echo 'Missing KOUROSH_AE_KEY_PASSWORD'; exit 1; }
          ./gradlew assembleRelease bundleRelease -PkouroshAeKeystore=release.keystore --no-daemon
      - name: Verify signed APKs
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified release APK: $apk"
          done
      - name: Upload signed APK and Play AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kourosh-AE-v2.1.18-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1.18 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create v2.1.18 --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title 'Kourosh-AE v2.1.18' --notes 'Premium automotive home redesign with native interactive controls, live server badge, secure connection card, and refreshed Kourosh-AE branding.'
      - name: Publish signed APK and AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.1.18 app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab \
            --repo "${{ github.repository }}" --clobber
